services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bedtracker
      POSTGRES_PASSWORD: depassword
      POSTGRES_DB: bedtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgres/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/initdb.d/init.sql

volumes:
  pgdata: