services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bedtracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: bedtracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: